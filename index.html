<!doctype html>
<html lang="pt-BR"><head>
<script>document.documentElement.classList.add("auth-pending");try{const t=Number(sessionStorage.getItem("plan12-login-entry"));if(t>0&&Date.now()-t<15000)document.documentElement.classList.add("login-arrival");}catch{}</script>
<meta charset="utf-8">
<title>Seu espaço financeiro</title>
<meta name="description" content="Organize gastos, entradas, dívidas e metas em um painel financeiro pessoal.">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="preload" href="/assets/raccoon-logo.webp" as="image">
<style>
.app-loading{display:none}
.auth-pending .app-loading{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:24px;box-sizing:border-box;background:var(--bg,#e7e5de);color:var(--text,#272a2b);visibility:visible;font:14px system-ui,sans-serif}
.app-loading img{width:min(200px,55vw);height:auto;object-fit:contain}
:root[data-theme=dark] .app-loading{background:var(--bg,#17191a);color:var(--text,#f7f4ec)}
:root[data-theme=dark] .app-loading img{filter:invert(1)}
</style>
<script>try{let a=JSON.parse(localStorage.getItem('plan12appearance'));if(a==='light'||a==='dark')document.documentElement.dataset.theme=a;}catch(e){}</script>




</head><body><div class="app-loading" role="status" aria-label="Carregando seu espaço" aria-live="polite"><img src="/assets/raccoon-logo.webp" alt="" width="200" height="183"></div><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
