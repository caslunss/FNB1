name: Quality checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    # Keep browser dependencies on an OS supported by the pinned Playwright release.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:types
      - run: npm run check:styles
      - run: npm run build
      - run: npm run check:release
      - name: Install isolated browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tools" --no-package-lock playwright@1.58.2
          "$RUNNER_TEMP/browser-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Browser regressions
        run: |
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/browser-tools/node_modules/playwright"
          export CHROMIUM_PATH="$(node -e 'process.stdout.write(require(process.env.PLAYWRIGHT_MODULE).chromium.executablePath())')"
          npm run dev -- --port 5173 > /tmp/vite.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 1
          done
          node tests/notifications.browser.cjs
          node tests/mobile-forms-login.browser.cjs
          node tests/audit-ui.browser.cjs
          node tests/design-system.browser.cjs
          node tests/finance-migration.browser.cjs
          node tests/ledger-actions.browser.cjs
          UI_WIDTHS=320,1440 node tests/option-controls.browser.cjs
          VISUAL_WIDTHS=320,1440 VISUAL_THEMES=light,dark VISUAL_AUDIT_DIR=/tmp/fnb-visual-ci node tests/visual-audit.browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-audit
          path: /tmp/fnb-visual-ci
          if-no-files-found: ignore
