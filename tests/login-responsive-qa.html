<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Revisão do login</title><style>body{font:14px system-ui;background:#eef0f4;margin:16px}button,select{padding:10px}iframe{display:block;border:1px solid #bbb}pre{white-space:pre-wrap}</style><label>Largura <select id="width"><option>320</option><option>390</option><option>768</option><option>1024</option><option>1440</option><option>1920</option></select></label><button id="show">Exibir login</button><button id="audit">Auditar 24 logins</button><pre id="results">Pronto</pre><iframe id="preview" title="Login isolado" width="320" height="850"></iframe><script>
const frame=document.querySelector('#preview'),results=document.querySelector('#results');
function load(width,theme='light',guest=false){return new Promise(resolve=>{frame.width=width;frame.onload=()=>{const d=frame.contentDocument;const ready=()=>{if(!d.querySelector('.login-shell'))return false;d.documentElement.dataset.theme=theme;if(guest)d.querySelector('#guestToggle')?.click();setTimeout(resolve,600);return true};if(!ready()){const obs=new MutationObserver(()=>{if(ready())obs.disconnect()});obs.observe(d,{subtree:true,childList:true})}};frame.src='../login.html?qa='+Date.now()})}
function inspect(width,theme,guest){const d=frame.contentDocument,w=frame.contentWindow;return {width,theme,guest,overflow:[...d.querySelectorAll('body *')].filter(e=>{const r=e.getBoundingClientRect();return r.width&&r.height&&!e.closest('[hidden],.lg-mirror,[data-lg-copy],.sr-only')&&w.getComputedStyle(e).position!=='fixed'&&(r.right>width+1||r.left< -1)}).slice(0,10).map(e=>({tag:e.tagName,class:e.className,text:e.textContent.slice(0,30),left:Math.round(e.getBoundingClientRect().left),right:Math.round(e.getBoundingClientRect().right)}))}}
document.querySelector('#show').onclick=()=>load(Number(document.querySelector('#width').value));document.querySelector('#audit').onclick=async()=>{const button=document.querySelector('#audit');button.disabled=true;const rows=[];for(const width of [320,390,768,1024,1440,1920])for(const theme of ['light','dark'])for(const guest of [false,true]){results.textContent='Verificando '+width+' / '+theme+' / '+guest;await load(width,theme,guest);rows.push(inspect(width,theme,guest))}results.textContent=JSON.stringify({cases:rows.length,failures:rows.filter(x=>x.overflow.length)},null,2);button.disabled=false};load(320);
</script></html>
