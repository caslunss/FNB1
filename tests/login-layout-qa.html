<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Revisão do login</title><style>body{font:14px system-ui;margin:16px;background:#eef0f4}header{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}select,button{padding:10px}iframe{display:block;border:1px solid #bbb}pre{white-space:pre-wrap}</style><header><label>Tela <select id="size"><option value="320,568">320 × 568</option><option value="390,844">390 × 844</option><option value="768,1024">768 × 1024</option><option value="1440,900">1440 × 900</option></select></label><label>Tema <select id="theme"><option>light</option><option>dark</option></select></label><button id="show">Exibir</button><button id="audit">Revisar login</button></header><pre id="results">Pronto</pre><iframe id="preview" title="Login"></iframe><script>
const frame=document.querySelector('#preview'),results=document.querySelector('#results');async function load(size,theme){const [w,h]=size.split(',').map(Number);frame.style.width=w+'px';frame.style.height=h+'px';await new Promise(resolve=>{frame.onload=()=>{frame.contentDocument.documentElement.dataset.theme=theme;setTimeout(resolve,800)};frame.src='/login.html?qa='+Date.now()});return [w,h]}
function inspect(w,h,theme){const d=frame.contentDocument,s=d.querySelector('.login-shell'),a=d.querySelector('.login-actions'),b=d.querySelector('.login-theme-control'),r=s?.getBoundingClientRect(),actions=a?.getBoundingClientRect(),motion=b?.getBoundingClientRect();return {width:w,height:h,theme,shell:r?{width:r.width,height:r.height,radius:parseFloat(getComputedStyle(s).borderRadius)}:null,lowerActions:!!(r&&actions&&actions.top+actions.height/2>=r.top+r.height/2),overflow:d.documentElement.scrollWidth>w+1,motionOverlap:!!(motion&&actions&&motion.left<actions.right&&motion.right>actions.left&&motion.top<actions.bottom&&motion.bottom>actions.top)}}
document.querySelector('#show').onclick=()=>load(document.querySelector('#size').value,document.querySelector('#theme').value);document.querySelector('#audit').onclick=async()=>{const rows=[];document.querySelector('#audit').disabled=true;for(const size of ['320,568','390,844','768,1024','1440,900'])for(const theme of ['light','dark']){results.textContent='Verificando '+size+' / '+theme;const [w,h]=await load(size,theme);rows.push(inspect(w,h,theme))}results.textContent=JSON.stringify({cases:rows.length,failures:rows.filter(x=>!x.shell||x.shell.radius<28||x.shell.radius>48||!x.lowerActions||x.overflow||x.motionOverlap),rows},null,2);document.querySelector('#audit').disabled=false};load('390,844','light');
</script></html>
